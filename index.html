<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>B2 德语介词搭配核心词卡片</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Google Fonts: Inter 与 Noto Sans SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* 全局基础与手机端防滚动适配 */
    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 隐藏横向滚动条 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 3D 卡片翻转容器与正反面透视 */
    .perspective-container {
      perspective: 1200px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 1.5rem;
      overflow: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* 滑动动画过渡 */
    .swipe-transition {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
    }

    /* 按钮点击微缩放反馈 */
    .btn-press:active {
      transform: scale(0.95);
    }

    /* 抽屉动画 */
    .drawer-backdrop {
      transition: opacity 0.25s ease;
    }
    .drawer-panel {
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="flex items-center justify-center bg-slate-200 text-slate-900">

  <!-- 手机端主容器：桌面端居中拟物边框，移动端 100dvh 全屏 -->
  <div id="app-shell" class="relative w-full max-w-[480px] h-[100dvh] sm:h-[94dvh] sm:max-h-[860px] bg-[#F8FAFC] sm:rounded-[2.25rem] sm:shadow-2xl sm:border sm:border-slate-300/80 flex flex-col overflow-hidden">

    <!-- 顶部德国三色极细装饰线 -->
    <div class="w-full h-1 flex shrink-0">
      <div class="w-1/3 bg-slate-900"></div>
      <div class="w-1/3 bg-rose-600"></div>
      <div class="w-1/3 bg-amber-400"></div>
    </div>

    <!-- 顶部导航栏 -->
    <header class="px-4 pt-3 pb-2 flex items-center justify-between bg-white/90 backdrop-blur-md border-b border-slate-100 shrink-0 z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-xs tracking-tight shadow-sm">
          B2
        </div>
        <div>
          <h1 class="text-sm font-bold text-slate-900 leading-tight">德语介词搭配核心词</h1>
          <div class="flex items-center gap-2 text-[11px] text-slate-500 mt-0.5">
            <span id="header-progress-text" class="font-semibold text-slate-700">1 / 359</span>
            <span>·</span>
            <span id="header-mastered-count" class="text-emerald-600 font-medium">已掌握 0</span>
          </div>
        </div>
      </div>

      <!-- 右侧功能按钮组：自测模式 / 随机 / 词表抽屉 -->
      <div class="flex items-center gap-1.5">
        <button id="btn-test-mode" title="自测模式（隐藏介词提示）" class="btn-press px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
          </svg>
          <span>自测</span>
        </button>

        <button id="btn-shuffle" title="随机打乱顺序" class="btn-press p-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors" aria-label="随机打乱">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
          </svg>
        </button>

        <button id="btn-open-drawer" title="词表与搜索" class="btn-press p-2 rounded-xl bg-slate-900 text-white shadow-sm hover:bg-slate-800 transition-colors" aria-label="打开词表">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 进度条 -->
    <div class="w-full h-1 bg-slate-200/70 shrink-0">
      <div id="progress-bar" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0.3%;"></div>
    </div>

    <!-- 介词分类横向滚动筛选栏 -->
    <nav id="filter-bar" class="px-3 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar bg-white/60 border-b border-slate-200/60 shrink-0">
      <!-- 由 JS 动态渲染筛选胶囊 -->
    </nav>

    <!-- 中央卡片滑动舞台 -->
    <main id="card-stage" class="relative flex-1 flex flex-col items-center justify-center px-4 py-3 overflow-hidden touch-none">
      
      <!-- 底层背景装饰卡片（营造牌堆立体感） -->
      <div id="stack-card-2" class="absolute w-[84%] h-[78%] max-h-[470px] bg-white/50 rounded-3xl border border-slate-200/60 translate-y-4 scale-[0.92] pointer-events-none"></div>
      <div id="stack-card-1" class="absolute w-[88%] h-[80%] max-h-[480px] bg-white/80 rounded-3xl border border-slate-200/80 shadow-sm translate-y-2 scale-[0.96] pointer-events-none"></div>

      <!-- 滑动提示浮标：左滑下一张 / 右滑上一张 -->
      <div id="swipe-badge-left" class="pointer-events-none absolute right-6 top-1/2 -translate-y-1/2 z-30 opacity-0 transition-opacity duration-150 bg-slate-900/85 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-1">
        <span>下一张</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
      <div id="swipe-badge-right" class="pointer-events-none absolute left-6 top-1/2 -translate-y-1/2 z-30 opacity-0 transition-opacity duration-150 bg-slate-900/85 text-white px-3 py-1.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>上一张</span>
      </div>

      <!-- 可拖动与 3D 翻转的主卡片包装器 -->
      <div id="draggable-card" class="relative w-full h-[84%] max-h-[500px] perspective-container z-20 cursor-grab active:cursor-grabbing">
        <div id="card-inner" class="card-inner shadow-[0_12px_32px_-8px_rgba(15,23,42,0.12)] rounded-3xl">
          
          <!-- ================= 卡片正面 (FRONT) ================= -->
          <div class="card-face card-front bg-white border border-slate-200/90 flex flex-col justify-between p-5">
            <!-- 顶部状态与发音按钮 -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span id="front-index-badge" class="text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500">#001</span>
                <span id="front-status-badge" class="hidden text-[11px] font-semibold px-2.5 py-1 rounded-lg"></span>
              </div>

              <button type="button" data-action="speak" class="btn-press w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 flex items-center justify-center transition-colors shadow-xs" title="德语发音">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
              </button>
            </div>

            <!-- 中央核心德语词汇展示区 -->
            <div id="front-content" class="flex-1 flex flex-col justify-center gap-4 my-2 overflow-y-auto no-scrollbar">
              <!-- 由 JS 动态填充 Verb / Nomen / Adjektiv -->
            </div>

            <!-- 正面底部提示区 -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span class="flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
                左右滑动切换
              </span>
              <span class="font-medium text-indigo-500 flex items-center gap-1">
                点击卡片翻转
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </span>
            </div>
          </div>

          <!-- ================= 卡片背面 (BACK) ================= -->
          <div class="card-face card-back bg-gradient-to-b from-slate-50 to-white border border-slate-200/90 flex flex-col justify-between p-5">
            <!-- 顶部词头摘要与发音 -->
            <div class="flex items-start justify-between gap-2 pb-3 border-b border-slate-200/70">
              <div id="back-summary-words" class="text-xs font-semibold text-slate-500 leading-relaxed line-clamp-2">
                <!-- 德语词头摘要 -->
              </div>
              <button type="button" data-action="speak" class="btn-press shrink-0 w-9 h-9 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center justify-center transition-colors" title="德语发音">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
              </button>
            </div>

            <!-- 背面核心：介词 + 格 (Präposition + Kasus) 与中文释义 -->
            <div class="flex-1 flex flex-col items-center justify-center text-center my-2 gap-5 overflow-y-auto no-scrollbar">
              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">介词 + 格 (Präposition + Kasus)</div>
                <div id="back-prep-container" class="flex flex-wrap items-center justify-center gap-2">
                  <!-- 由 JS 动态渲染高对比度颜色徽章 -->
                </div>
              </div>

              <div class="w-12 h-0.5 bg-slate-200 rounded-full"></div>

              <div class="px-2">
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">中文释义</div>
                <p id="back-meaning" class="text-xl sm:text-2xl font-bold text-slate-800 leading-snug">
                  <!-- 中文含义 -->
                </p>
              </div>
            </div>

            <!-- 背面底部提示 -->
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <div class="flex items-center gap-2">
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-500"></span>+A 第四格</span>
                <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>+D 第三格</span>
              </div>
              <span class="font-medium text-slate-500">点击翻回正面</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 空筛选状态提示 -->
      <div id="empty-state" class="hidden flex-col items-center justify-center text-center p-6 bg-white rounded-3xl border border-slate-200 shadow-sm max-w-xs">
        <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-slate-800 mb-1">当前分类下暂无卡片</h3>
        <p class="text-xs text-slate-500 mb-4">您可以切换其他介词分类或返回全部词库继续学习。</p>
        <button id="btn-reset-filter" class="btn-press px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">查看全部 (359)</button>
      </div>
    </main>

    <!-- 底部快捷操作区：上一张 / 需复习 / 翻转 / 已掌握 / 下一张 -->
    <footer class="px-4 pt-2 pb-4 bg-white border-t border-slate-200/80 shrink-0 z-10">
      <div class="grid grid-cols-5 gap-2 items-center">
        <!-- 上一张 -->
        <button id="btn-prev" class="btn-press h-12 rounded-2xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 flex flex-col items-center justify-center transition-colors" title="上一张 (←)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <!-- 标记需复习 -->
        <button id="btn-mark-review" class="btn-press h-12 rounded-2xl bg-amber-50 hover:bg-amber-100 border border-amber-200/80 text-amber-700 flex flex-col items-center justify-center transition-colors">
          <span class="text-xs font-bold leading-none">需复习</span>
          <span class="text-[10px] opacity-75 mt-1">加入生词</span>
        </button>

        <!-- 翻转卡片 -->
        <button id="btn-flip" class="btn-press h-12 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/20 flex flex-col items-center justify-center transition-colors">
          <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="text-[10px] font-semibold leading-none">翻转</span>
        </button>

        <!-- 标记已掌握 -->
        <button id="btn-mark-mastered" class="btn-press h-12 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 text-emerald-700 flex flex-col items-center justify-center transition-colors">
          <span class="text-xs font-bold leading-none">已掌握</span>
          <span class="text-[10px] opacity-75 mt-1">下一张</span>
        </button>

        <!-- 下一张 -->
        <button id="btn-next" class="btn-press h-12 rounded-2xl bg-slate-100 hover:bg-slate-200/80 text-slate-700 flex flex-col items-center justify-center transition-colors" title="下一张 (→)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </footer>

    <!-- 轻量 Toast 提示框 -->
    <div id="toast" class="pointer-events-none fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-medium px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-200">
      提示信息
    </div>

    <!-- ================= 词表与搜索抽屉模态框 ================= -->
    <div id="drawer-overlay" class="hidden fixed inset-0 z-40 flex justify-end">
      <!-- 半透明遮罩 -->
      <div id="drawer-backdrop" class="drawer-backdrop absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] opacity-0"></div>

      <!-- 抽屉内容面板 -->
      <div id="drawer-panel" class="drawer-panel relative w-full max-w-[420px] h-full bg-white shadow-2xl flex flex-col translate-x-full">
        <!-- 抽屉头部 -->
        <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between shrink-0">
          <div>
            <h2 class="text-base font-bold text-slate-900">词汇总览与检索</h2>
            <p id="drawer-stats-text" class="text-xs text-slate-500 mt-0.5">共 359 条 · 已掌握 0 · 需复习 0</p>
          </div>
          <button id="btn-close-drawer" class="btn-press p-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- 搜索框与重置进度按钮 -->
        <div class="p-3 bg-slate-50 border-b border-slate-200/70 flex flex-col gap-2 shrink-0">
          <div class="relative">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input id="search-input" type="text" placeholder="搜索德语动词、名词、形容词、介词或中文..." class="w-full pl-9 pr-8 py-2 rounded-xl bg-white border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-500" />
            <button id="btn-clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="flex items-center justify-between text-xs">
            <span id="drawer-result-count" class="text-slate-500 font-medium">显示 359 条结果</span>
            <button id="btn-reset-progress" class="text-rose-600 hover:text-rose-700 font-semibold px-2 py-1 rounded-lg hover:bg-rose-50 transition-colors">
              清空学习记录
            </button>
          </div>
        </div>

        <!-- 词条列表滚动区 -->
        <div id="drawer-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
          <!-- 由 JS 动态渲染列表 -->
        </div>
      </div>
    </div>

  </div>

  <script>
    /**
     * 完整的 B2 德语介词搭配核心词数据 (共 359 条)
     * 数据结构: [Verb(动词), Nomen(名词), Adjektiv(形容词), Präposition+Kasus(介词+格), Meaning(中文释义)]
     */
    const VOCAB_DATA = [
      ["abhängen","die Abhängigkeit","abhängig","von + D","依赖于...，取决于..."],
      ["abhalten","-","-","von + D","阻止...，妨碍..."],
      ["(sich) abmelden","die Abmeldung","-","von + D","注销...，取消...的登记"],
      ["abraten","-","-","von + D","劝阻做..."],
      ["achten","-","-","auf + A","注意...，重视..."],
      ["-","die Allergie","allergisch","auf + A","对...过敏 / 对...过敏的"],
      ["-","die Alternative","alternativ","zu + D","...的替代方案 / 作为...的替代"],

    // 将原始数据转换为带唯一 ID 的对象数组
    const ALL_ITEMS = VOCAB_DATA.map((row, idx) => ({
      id: idx,
      verb: row[0],
      noun: row[1],
      adj: row[2],
      prep: row[3],
      meaning: row[4]
    }));

    // 本地存储 Key
    const STORAGE_KEY = 'b2_german_prep_flashcards_v1';

    // 应用状态
    let state = {
      activeFilter: 'ALL',
      filteredItems: [...ALL_ITEMS],
      currentIndex: 0,
      isFlipped: false,
      isShuffled: false,
      testMode: false, // 自测模式：正面不显示提示，仅展示核心词
      masteredIds: new Set(),
      reviewIds: new Set(),
      searchQuery: ''
    };

    // 预设介词筛选项
    const FILTER_OPTIONS = [
      { key: 'ALL', label: '全部' },
      { key: 'REVIEW', label: '⭐ 需复习' },
      { key: 'auf + A', label: 'auf + A' },
      { key: 'von + D', label: 'von + D' },
      { key: 'mit + D', label: 'mit + D' },

      { key: 'OTHER', label: '其他' }

    const PRIMARY_PREPS = [
      'auf + A', 'von + D', 'mit + D', 'über + A', 'für + A',
      'an + D', 'an + A', 'zu + D', 'bei + D', 'vor + D',
      'um + A', 'nach + D', 'gegenüber + D'

    // DOM 引用
    const els = {

    /**
     * 从 localStorage 加载学习进度
     */
    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.masteredIds)) {
            state.masteredIds = new Set(parsed.masteredIds);
          }
          if (Array.isArray(parsed.reviewIds)) {
            state.reviewIds = new Set(parsed.reviewIds);
          }
          if (typeof parsed.testMode === 'boolean') {
            state.testMode = parsed.testMode;
          }
        }
      } catch (e) {
        console.warn('读取本地进度失败:', e);
      }
    }

    /**
     * 保存学习进度到 localStorage
     */
    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          masteredIds: Array.from(state.masteredIds),
          reviewIds: Array.from(state.reviewIds),
          testMode: state.testMode
        }));
      } catch (e) {
        console.warn('保存本地进度失败:', e);
      }
    }

    /**
     * 显示轻提示 Toast
     */
    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.add('opacity-0');
      }, 1600);
    }

    /**
     * 判断某条词条是否匹配指定筛选条件
     */
    function matchesFilter(item, filterKey) {
      if (filterKey === 'ALL') return true;
      if (filterKey === 'REVIEW') return state.reviewIds.has(item.id);
      if (filterKey === 'in + D/A') {
        return item.prep.includes('in + D') || item.prep.includes('in + A');
      }
      if (filterKey === 'OTHER') {
        const isPrimary = PRIMARY_PREPS.some(p => item.prep.includes(p)) ||
                          item.prep.includes('in + D') ||
                          item.prep.includes('in + A');
        return !isPrimary;
      }
      return item.prep.includes(filterKey);
    }

    /**
     * 应用筛选与可选随机乱序
     */
    function applyFilter(filterKey, preserveIndex = false) {
      state.activeFilter = filterKey;
      let list = ALL_ITEMS.filter(item => matchesFilter(item, filterKey));

      if (state.isShuffled) {
        list = shuffleArray([...list]);
      }

      state.filteredItems = list;
      if (!preserveIndex) {
        state.currentIndex = 0;
      } else if (state.currentIndex >= list.length) {
        state.currentIndex = Math.max(0, list.length - 1);
      }

      state.isFlipped = false;
      els.cardInner.classList.remove('is-flipped');

      renderFilterBar();
      renderCurrentCard();
    }

    /**
     * Fisher-Yates 洗牌算法
     */
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * 渲染顶部介词筛选胶囊栏
     */
    function renderFilterBar() {
      els.filterBar.innerHTML = '';
      FILTER_OPTIONS.forEach(opt => {
        const count = ALL_ITEMS.filter(item => matchesFilter(item, opt.key)).length;
        const isActive = state.activeFilter === opt.key;

        const btn = document.createElement('button');
        btn.className = `btn-press shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1 ${
          isActive
            ? 'bg-slate-900 text-white shadow-xs'
            : 'bg-white text-slate-600 border border-slate-200/90 hover:bg-slate-100'
        }`;
        btn.innerHTML = `<span>${opt.label}</span><span class="text-[10px] ${isActive ? 'text-slate-300' : 'text-slate-400'}">${count}</span>`;
        btn.addEventListener('click', () => {
          applyFilter(opt.key, false);
          // 自动将激活的胶囊滚入视野
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
        els.filterBar.appendChild(btn);
      });
    }

    /**
     * 高亮德语名词定冠词 der / die / das
     */
    function formatGermanNounHTML(nounStr) {
      if (!nounStr || nounStr === '-') return '';
      return nounStr.replace(/\b(der|die|das)\b/g, (match) => {
        let colorClass = 'text-indigo-600 bg-indigo-50';
        if (match === 'die') colorClass = 'text-rose-600 bg-rose-50';
        if (match === 'das') colorClass = 'text-emerald-600 bg-emerald-50';
        return `<span class="inline-block px-1.5 py-0.5 rounded-md text-sm font-bold ${colorClass} mr-1">${match}</span>`;
      });
    }

    /**
     * 渲染介词 + 格的高对比度色彩标签
     */
    function renderPrepBadgesHTML(prepStr) {
      if (!prepStr || prepStr === '-') {
        return `<span class="px-4 py-2 rounded-2xl bg-slate-200 text-slate-700 font-bold text-lg">无固定介词</span>`;
      }

      // 拆解如 "über + A / mit + D" 的复合项
      const parts = prepStr.split('/').map(s => s.trim());
      return parts.map(part => {
        let styleClass = 'bg-slate-800 text-white border-slate-700';
        if (part.includes('+ A') && !part.includes('+ D')) {
          styleClass = 'bg-indigo-600 text-white border-indigo-500 shadow-md shadow-indigo-600/20';
        } else if (part.includes('+ D') && !part.includes('+ A')) {
          styleClass = 'bg-emerald-600 text-white border-emerald-500 shadow-md shadow-emerald-600/20';
        } else if (part.includes('+ D') && part.includes('+ A')) {
          styleClass = 'bg-purple-600 text-white border-purple-500 shadow-md shadow-purple-600/20';
        }
        return `<span class="px-5 py-2.5 rounded-2xl border text-2xl sm:text-3xl font-extrabold tracking-tight ${styleClass}">${part}</span>`;
      }).join('');
    }

    /**
     * 渲染当前主卡片与顶部进度状态
     */
    function renderCurrentCard() {
      const total = state.filteredItems.length;
      els.headerMastered.textContent = `已掌握 ${state.masteredIds.size}`;

      // 同步自测按钮样式
      if (state.testMode) {
        els.btnTestMode.className = 'btn-press px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-indigo-600 bg-indigo-600 text-white flex items-center gap-1 transition-colors shadow-xs';
      } else {
        els.btnTestMode.className = 'btn-press px-2.5 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-600 flex items-center gap-1 transition-colors';
      }

      // 同步随机按钮样式
      if (state.isShuffled) {
        els.btnShuffle.className = 'btn-press p-2 rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-600 transition-colors';
      } else {
        els.btnShuffle.className = 'btn-press p-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors';
      }

      if (total === 0) {
        els.draggableCard.classList.add('hidden');
        els.stackCard1.classList.add('hidden');
        els.stackCard2.classList.add('hidden');
        els.emptyState.classList.remove('hidden');
        els.emptyState.classList.add('flex');
        els.headerProgress.textContent = '0 / 0';
        els.progressBar.style.width = '0%';
        return;
      }

      els.draggableCard.classList.remove('hidden');
      els.stackCard1.classList.remove('hidden');
      els.stackCard2.classList.remove('hidden');
      els.emptyState.classList.add('hidden');
      els.emptyState.classList.remove('flex');

      const item = state.filteredItems[state.currentIndex];
      const currentNum = state.currentIndex + 1;
      els.headerProgress.textContent = `${currentNum} / ${total}`;
      els.progressBar.style.width = `${(currentNum / total) * 100}%`;

      // 正面编号与掌握状态徽章
      els.frontIndexBadge.textContent = `#${String(item.id + 1).padStart(3, '0')}`;
      if (state.masteredIds.has(item.id)) {
        els.frontStatusBadge.textContent = '✓ 已掌握';
        els.frontStatusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200/70';
      } else if (state.reviewIds.has(item.id)) {
        els.frontStatusBadge.textContent = '★ 需复习';
        els.frontStatusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200/70';
      } else {
        els.frontStatusBadge.className = 'hidden';
      }

      // 构建正面词性模块
      let frontBlocks = [];

      if (item.verb && item.verb !== '-') {
        frontBlocks.push(`
          <div class="bg-slate-50/90 border border-slate-200/60 rounded-2xl p-3.5">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Verb · 动词</span>
            </div>
            <div class="text-2xl sm:text-[26px] font-extrabold text-slate-900 leading-snug break-words">${item.verb}</div>
          </div>
        `);
      }

      if (item.noun && item.noun !== '-') {
        frontBlocks.push(`
          <div class="bg-slate-50/90 border border-slate-200/60 rounded-2xl p-3.5">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Nomen · 名词</span>
            </div>
            <div class="text-lg sm:text-xl font-bold text-slate-800 leading-snug break-words">${formatGermanNounHTML(item.noun)}</div>
          </div>
        `);
      }

      if (item.adj && item.adj !== '-') {
        frontBlocks.push(`
          <div class="bg-slate-50/90 border border-slate-200/60 rounded-2xl p-3.5">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Adjektiv · 形容词</span>
            </div>
            <div class="text-lg sm:text-xl font-bold text-slate-800 leading-snug break-words">${item.adj}</div>
          </div>
        `);
      }

      // 自测模式下在正面底部添加引导提问
      if (state.testMode) {
        frontBlocks.push(`
          <div class="mt-1 py-2 px-3 rounded-xl bg-indigo-50/80 border border-indigo-100 text-center text-xs font-semibold text-indigo-700">
            🤔 自测中：请回忆对应的「介词 + 格」与中文含义
          </div>
        `);
      }

      els.frontContent.innerHTML = frontBlocks.join('');

      // 背面顶部词头摘要
      const summaryParts = [item.verb, item.noun, item.adj].filter(v => v && v !== '-');
      els.backSummaryWords.textContent = summaryParts.join(' · ');

      // 背面介词 + 格
      els.backPrepContainer.innerHTML = renderPrepBadgesHTML(item.prep);

      // 背面中文释义
      els.backMeaning.textContent = item.meaning;
    }

    /**
     * 使用 Web Speech API (de-DE) 朗读当前德语词条
     */
    function speakCurrentItem() {
      if (state.filteredItems.length === 0) return;
      const item = state.filteredItems[state.currentIndex];

      // 清理括号补充说明，使朗读更自然
      const cleanWord = (str) => {
        if (!str || str === '-') return '';
        return str.replace(/\(.*?\)/g, '').replace(/\//g, ', ').trim();
      };

      const parts = [cleanWord(item.verb), cleanWord(item.noun), cleanWord(item.adj)].filter(Boolean);
      const textToSpeak = parts.join('. ');

      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音朗读');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'de-DE';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    /**
     * 翻转当前卡片
     */
    function flipCard() {
      if (state.filteredItems.length === 0) return;
      state.isFlipped = !state.isFlipped;
      els.cardInner.classList.toggle('is-flipped', state.isFlipped);
    }

    /**
     * 切换到下一张或上一张，带滑出滑入过渡动画
     * @param {number} direction 1 表示下一张(左滑), -1 表示上一张(右滑)
     */
    let isAnimatingCard = false;
    function navigateCard(direction) {
      const total = state.filteredItems.length;
      if (total <= 1 || isAnimatingCard) {
        if (total === 1) showToast('当前分类仅有一张卡片');
        return;
      }

      isAnimatingCard = true;
      const exitX = direction === 1 ? -320 : 320;
      const exitRotate = direction === 1 ? -14 : 14;

      els.draggableCard.classList.add('swipe-transition');
      els.draggableCard.style.transform = `translate3d(${exitX}px, 16px, 0) rotate(${exitRotate}deg)`;
      els.draggableCard.style.opacity = '0';

      setTimeout(() => {
        // 更新索引并重置为正面
        state.currentIndex = (state.currentIndex + direction + total) % total;
        state.isFlipped = false;
        els.cardInner.classList.remove('is-flipped');

        // 瞬间将卡片移到入场起点
        els.draggableCard.classList.remove('swipe-transition');
        const enterX = direction === 1 ? 80 : -80;
        els.draggableCard.style.transform = `translate3d(${enterX}px, 0, 0) scale(0.96)`;
        els.draggableCard.style.opacity = '0';

        renderCurrentCard();

        // 强制重排后执行平滑入场
        void els.draggableCard.offsetWidth;
        els.draggableCard.classList.add('swipe-transition');
        els.draggableCard.style.transform = 'translate3d(0, 0, 0) rotate(0deg) scale(1)';
        els.draggableCard.style.opacity = '1';

        setTimeout(() => {
          els.draggableCard.classList.remove('swipe-transition');
          isAnimatingCard = false;
        }, 320);
      }, 220);
    }

    /**
     * 标记当前卡片为“已掌握”或“需复习”
     */
    function markCardStatus(status) {
      if (state.filteredItems.length === 0) return;
      const item = state.filteredItems[state.currentIndex];

      if (status === 'mastered') {
        state.masteredIds.add(item.id);
        state.reviewIds.delete(item.id);
        saveProgress();
        renderFilterBar();
        showToast('✓ 已标记为掌握');
        if (state.filteredItems.length > 1) {
          navigateCard(1);
        } else {
          renderCurrentCard();
        }
      } else if (status === 'review') {
        state.reviewIds.add(item.id);
        state.masteredIds.delete(item.id);
        saveProgress();
        renderFilterBar();
        showToast('★ 已加入需复习列表');
        if (state.filteredItems.length > 1) {
          navigateCard(1);
        } else {
          renderCurrentCard();
        }
      }
    }

    /**
     * 绑定手势拖动（支持触摸 Touch 与桌面鼠标 Mouse Drag）
     */
    function initCardGestures() {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let isDragging = false;
      let hasMoved = false;

      const onPointerDown = (clientX, clientY, target) => {
        // 如果点击的是发音按钮，不启动拖动
        if (target.closest('[data-action="speak"]')) return;
        if (isAnimatingCard || state.filteredItems.length === 0) return;

        isDragging = true;
        hasMoved = false;
        startX = clientX;
        startY = clientY;
        currentX = 0;
        currentY = 0;
        els.draggableCard.classList.remove('swipe-transition');
      };

      const onPointerMove = (clientX, clientY) => {
        if (!isDragging) return;
        currentX = clientX - startX;
        currentY = clientY - startY;

        if (Math.abs(currentX) > 6 || Math.abs(currentY) > 6) {
          hasMoved = true;
        }

        // 限制垂直阻尼并计算倾斜角度
        const dampY = currentY * 0.25;
        const rotateDeg = currentX * 0.045;
        els.draggableCard.style.transform = `translate3d(${currentX}px, ${dampY}px, 0) rotate(${rotateDeg}deg)`;

        // 显示左右滑动指示浮标
        if (currentX < -45) {
          els.swipeBadgeLeft.style.opacity = Math.min(1, (-currentX - 45) / 60);
          els.swipeBadgeRight.style.opacity = '0';
        } else if (currentX > 45) {
          els.swipeBadgeRight.style.opacity = Math.min(1, (currentX - 45) / 60);
          els.swipeBadgeLeft.style.opacity = '0';
        } else {
          els.swipeBadgeLeft.style.opacity = '0';
          els.swipeBadgeRight.style.opacity = '0';
        }
      };

      const onPointerUp = (target) => {
        if (!isDragging) return;
        isDragging = false;
        els.swipeBadgeLeft.style.opacity = '0';
        els.swipeBadgeRight.style.opacity = '0';

        // 若几乎未拖动，则视为点击 -> 翻转卡片
        if (!hasMoved) {
          els.draggableCard.style.transform = '';
          if (!target.closest('[data-action="speak"]')) {
            flipCard();
          }
          return;
        }

        const threshold = 75;
        if (currentX < -threshold) {
          // 向左滑 -> 下一张
          navigateCard(1);
        } else if (currentX > threshold) {
          // 向右滑 -> 上一张
          navigateCard(-1);
        } else {
          // 未达到阈值，弹性回弹至中心
          els.draggableCard.classList.add('swipe-transition');
          els.draggableCard.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
        }
      };

      // Touch 事件
      els.draggableCard.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          onPointerDown(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });

      els.draggableCard.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      els.draggableCard.addEventListener('touchend', (e) => {
        onPointerUp(e.target);
      });

      // Mouse 事件（兼容桌面测试）
      els.draggableCard.addEventListener('mousedown', (e) => {
        onPointerDown(e.clientX, e.clientY, e.target);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          onPointerMove(e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging) {
          onPointerUp(e.target);
        }
      });

      // 卡片内所有发音按钮点击事件
      els.draggableCard.addEventListener('click', (e) => {
        const speakBtn = e.target.closest('[data-action="speak"]');
        if (speakBtn) {
          e.stopPropagation();
          speakCurrentItem();
        }
      });
    }

    /**
     * 打开/关闭词表检索抽屉
     */
    function openDrawer() {
      renderDrawerList();
      els.drawerOverlay.classList.remove('hidden');
      void els.drawerOverlay.offsetWidth;
      els.drawerBackdrop.classList.remove('opacity-0');
      els.drawerPanel.classList.remove('translate-x-full');
    }

    function closeDrawer() {
      els.drawerBackdrop.classList.add('opacity-0');
      els.drawerPanel.classList.add('translate-x-full');
      setTimeout(() => {
        els.drawerOverlay.classList.add('hidden');
      }, 300);
    }

    /**
     * 渲染抽屉内的词条搜索列表
     */
    function renderDrawerList() {
      const q = state.searchQuery.trim().toLowerCase();
      els.drawerStatsText.textContent = `共 ${ALL_ITEMS.length} 条 · 已掌握 ${state.masteredIds.size} · 需复习 ${state.reviewIds.size}`;

      const results = ALL_ITEMS.filter(item => {
        if (!q) return true;
        return (
          item.verb.toLowerCase().includes(q) ||
          item.noun.toLowerCase().includes(q) ||
          item.adj.toLowerCase().includes(q) ||
          item.prep.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q)
        );
      });

      els.drawerResultCount.textContent = `显示 ${results.length} 条结果`;

      if (results.length === 0) {
        els.drawerList.innerHTML = `
          <div class="p-8 text-center text-sm text-slate-400">
            未找到匹配的德语词条或释义
          </div>
        `;
        return;
      }

      const html = results.map(item => {
        const titleParts = [item.verb, item.noun, item.adj].filter(v => v && v !== '-');
        const isMastered = state.masteredIds.has(item.id);
        const isReview = state.reviewIds.has(item.id);

        let statusDot = '';
        if (isMastered) statusDot = '<span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0" title="已掌握"></span>';
        else if (isReview) statusDot = '<span class="w-2 h-2 rounded-full bg-amber-500 shrink-0" title="需复习"></span>';

        const prepColor = item.prep.includes('+ A') && !item.prep.includes('+ D')
          ? 'bg-indigo-50 text-indigo-700 border-indigo-200/70'
          : item.prep.includes('+ D') && !item.prep.includes('+ A')
          ? 'bg-emerald-50 text-emerald-700 border-emerald-200/70'
          : 'bg-purple-50 text-purple-700 border-purple-200/70';

        return `
          <button type="button" data-jump-id="${item.id}" class="w-full text-left px-4 py-3 hover:bg-slate-50 active:bg-slate-100 transition-colors flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-mono text-slate-400">#${String(item.id + 1).padStart(3, '0')}</span>
                ${statusDot}
                <span class="text-sm font-bold text-slate-900 truncate">${titleParts.join(' · ')}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1 line-clamp-1">${item.meaning}</p>
            </div>
            <span class="shrink-0 px-2 py-1 rounded-lg border text-[11px] font-bold ${prepColor}">
              ${item.prep}
            </span>
          </button>
        `;
      }).join('');

      els.drawerList.innerHTML = html;
    }

    /**
     * 绑定全部按钮与键盘事件
     */
    function initControls() {
      document.getElementById('btn-prev').addEventListener('click', () => navigateCard(-1));
      document.getElementById('btn-next').addEventListener('click', () => navigateCard(1));
      document.getElementById('btn-flip').addEventListener('click', flipCard);
      document.getElementById('btn-mark-mastered').addEventListener('click', () => markCardStatus('mastered'));
      document.getElementById('btn-mark-review').addEventListener('click', () => markCardStatus('review'));

      document.getElementById('btn-reset-filter').addEventListener('click', () => applyFilter('ALL', false));

      // 自测模式切换
      els.btnTestMode.addEventListener('click', () => {
        state.testMode = !state.testMode;
        saveProgress();
        renderCurrentCard();
        showToast(state.testMode ? '已开启自测模式' : '已关闭自测模式');
      });

      // 随机乱序切换
      els.btnShuffle.addEventListener('click', () => {
        state.isShuffled = !state.isShuffled;
        applyFilter(state.activeFilter, false);
        showToast(state.isShuffled ? '已打乱当前词卡顺序' : '已恢复原始词表顺序');
      });

      // 抽屉开关
      document.getElementById('btn-open-drawer').addEventListener('click', openDrawer);
      document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
      els.drawerBackdrop.addEventListener('click', closeDrawer);

      // 搜索输入
      els.searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        els.btnClearSearch.classList.toggle('hidden', !state.searchQuery);
        renderDrawerList();
      });

      els.btnClearSearch.addEventListener('click', () => {
        state.searchQuery = '';
        els.searchInput.value = '';
        els.btnClearSearch.classList.add('hidden');
        renderDrawerList();
        els.searchInput.focus();
      });

      // 点击抽屉中的某个词条直接跳转
      els.drawerList.addEventListener('click', (e) => {
        const itemBtn = e.target.closest('[data-jump-id]');
        if (!itemBtn) return;
        const targetId = Number(itemBtn.getAttribute('data-jump-id'));

        // 若当前筛选中不包含该词条，自动切回全部
        let idx = state.filteredItems.findIndex(it => it.id === targetId);
        if (idx === -1) {
          state.activeFilter = 'ALL';
          state.isShuffled = false;
          state.filteredItems = [...ALL_ITEMS];
          idx = state.filteredItems.findIndex(it => it.id === targetId);
          renderFilterBar();
        }

        state.currentIndex = Math.max(0, idx);
        state.isFlipped = false;
        els.cardInner.classList.remove('is-flipped');
        renderCurrentCard();
        closeDrawer();
      });

      // 清空学习记录（二次点击确认，避免使用 confirm()）
      let resetConfirmPending = false;
      let resetConfirmTimer = null;
      const btnResetProgress = document.getElementById('btn-reset-progress');
      btnResetProgress.addEventListener('click', () => {
        if (!resetConfirmPending) {
          resetConfirmPending = true;
          btnResetProgress.textContent = '再次点击确认清空';
          btnResetProgress.classList.add('bg-rose-600', 'text-white');
          btnResetProgress.classList.remove('text-rose-600');
          resetConfirmTimer = setTimeout(() => {
            resetConfirmPending = false;
            btnResetProgress.textContent = '清空学习记录';
            btnResetProgress.classList.remove('bg-rose-600', 'text-white');
            btnResetProgress.classList.add('text-rose-600');
          }, 3000);
        } else {
          clearTimeout(resetConfirmTimer);
          resetConfirmPending = false;
          btnResetProgress.textContent = '清空学习记录';
          btnResetProgress.classList.remove('bg-rose-600', 'text-white');
          btnResetProgress.classList.add('text-rose-600');

          state.masteredIds.clear();
          state.reviewIds.clear();
          saveProgress();
          renderFilterBar();
          renderCurrentCard();
          renderDrawerList();
          showToast('已清空所有学习进度');
        }
      });

      // 键盘方向键与空格支持
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === els.searchInput) return;
        if (!els.drawerOverlay.classList.contains('hidden')) {
          if (e.key === 'Escape') closeDrawer();
          return;
        }
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateCard(1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigateCard(-1);
        } else if (e.key === ' ') {
          e.preventDefault();
          flipCard();
        }
      });
    }

    // 启动初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      initCardGestures();
      initControls();
      applyFilter('ALL', false);
    });
  </script>
</body>
</html>
